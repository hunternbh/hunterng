{% assign rabbit_asset = '/images/academic-rabbit' %}
{% if include.kind == 'teaching' or include.kind == 'cv' %}
  {% assign rabbit_asset = rabbit_asset | append: '-' | append: include.kind %}
{% endif %}
<picture class="academic-rabbit academic-rabbit--{{ include.kind }}">
  <source media="(prefers-reduced-motion: reduce)" srcset="{{ rabbit_asset | append: '.png' | relative_url }}">
  <img src="{{ rabbit_asset | append: '.gif' | relative_url }}" alt="">
</picture>
