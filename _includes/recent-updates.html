<aside class="recent-updates" aria-labelledby="recent-updates-title">
  <h2 id="recent-updates-title">
    Recent Updates
  </h2>
  {% include updates-list.html updates=include.updates limit=5 heading="h3" %}
  <div class="recent-updates__footer">
    <a href="{{ '/updates/' | relative_url }}">See Archived Updates</a>
    {% if site.author.email %}
      <a href="mailto:{{ site.author.email | escape }}">{{ site.author.email | escape }}</a>
    {% endif %}
  </div>
</aside>
